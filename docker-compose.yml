# Production-like local environment: Gunicorn + PostgreSQL + Nginx-served
# frontend build. See docs/DEVOPS.md for full usage instructions.
#
#   cp .env.example .env   # then edit values
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karosl}
      POSTGRES_USER: ${POSTGRES_USER:-karosl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host by default — the app only needs it on the
    # internal compose network, and 5432 is frequently already taken by a
    # host Postgres install. Uncomment to inspect with a local psql/GUI
    # client (and adjust POSTGRES_PORT in .env if 5432 is taken):
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karosl_user} -d ${POSTGRES_DB:-karosl}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
      # No TLS termination in this local compose setup (see docs/DEVOPS.md) —
      # forcing HTTPS redirects/secure cookies here would break all access.
      SECURE_SSL_REDIRECT: "False"
      CSRF_COOKIE_SECURE: "False"
      SESSION_COOKIE_SECURE: "False"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_backups:/app/backups
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
  backend_backups:
  backend_logs:
