# KarosL — test, build-validate, and deploy the staging environment.
#
# ci.yml deliberately stays read-only: it covers dev/PRs, runs on
# GitHub-hosted runners, no deploy credentials. This workflow covers exactly
# one branch, cloud-deployment, and nothing else — no PRs, no other branches,
# so a feature branch is never auto-deployed to the live pilot (docs/CI_CD.md
# "Branch strategy").
#
# The deploy job `needs:` all three test/build jobs, so a test or build
# failure blocks deployment outright — nothing here ever deploys unverified
# code.
#
# Deploy runs on a SELF-HOSTED runner (label `karosl-staging`) installed
# directly on the EC2 instance — added 2026-08-20 after discovering the
# original SSH-based design could never actually work: the instance's
# security group only allows SSH from the operator's own /32, and GitHub's
# hosted runners connect from thousands of dynamic IPs that were never going
# to be on that allowlist (confirmed by the pipeline's first real run
# failing at the host-key step). Running the deploy step ON the instance
# needs no inbound network change at all — the runner polls GitHub
# outbound. Full record: docs/CI_CD.md.
#
# SECURITY INVARIANT — do not weaken this without deliberately re-deciding
# it: the self-hosted runner (`karosl-staging` label) must NEVER be used by
# any workflow that can be triggered by a pull_request from a fork —
# concretely, never by ci.yml. This repo is public; a self-hosted runner
# reachable from a fork's PR workflow is a remote-code-execution path onto
# the live pilot instance. deploy-staging.yml is safe because its trigger is
# `push: branches: [cloud-deployment]` only, with no `pull_request` trigger
# of any kind — only someone who can already push to cloud-deployment can
# reach this runner.
#
# EC2_DEPLOY_KEY / EC2_USER (the old SSH deploy key and its forced-command
# entrypoint, scripts/ci-deploy-entrypoint.sh) are no longer used by this
# workflow as of the self-hosted-runner change, but were deliberately left
# in place rather than revoked as part of this same pass — see
# docs/CI_CD.md for the recommendation to retire them separately.

name: Deploy to staging

on:
  push:
    branches: [cloud-deployment]

permissions:
  contents: read

# Only one staging deployment at a time. Queue, don't cancel: cancelling a
# deploy mid-flight (mid-build, mid-restart) is worse than a short wait for
# the next push's deploy to start after this one finishes.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite
            db_engine: django.db.backends.sqlite3
            db_name: ''
            db_user: ''
            db_password: ''
            db_host: ''
            db_port: ''
          - name: postgres
            db_engine: django.db.backends.postgresql
            db_name: karosl_ci
            db_user: karosl_user
            db_password: ci-throwaway-not-a-secret
            db_host: 127.0.0.1
            db_port: '5432'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: karosl_ci
          POSTGRES_USER: karosl_user
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DB_ENGINE: ${{ matrix.db_engine }}
          DB_NAME: ${{ matrix.db_name }}
          DB_USER: ${{ matrix.db_user }}
          DB_PASSWORD: ${{ matrix.db_password }}
          DB_HOST: ${{ matrix.db_host }}
          DB_PORT: ${{ matrix.db_port }}
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create a throwaway .env so Compose can interpolate
        run: cp .env.example .env

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Build images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          targets: |
            backend
            frontend
          push: false
          load: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  deploy:
    name: Deploy to EC2
    # Self-hosted, on the instance itself — see the security invariant in
    # the file header. Never add any other label/runner here without
    # re-reading that comment.
    runs-on: [self-hosted, karosl-staging]
    needs: [backend, frontend, docker]
    # Belt-and-braces alongside `needs:` — GitHub already skips this job if
    # any dependency fails, but being explicit here means a future workflow
    # edit that changes `needs:` can't silently reintroduce "deploy on
    # partial failure" behavior without this condition also being touched.
    if: success()
    steps:
      - name: Deploy (runs directly on the instance — no SSH hop needed)
        # The runner IS the instance, so this is just the same command an
        # operator would type by hand over SSH, run locally instead.
        run: |
          cd ~/apps/karosl
          ./scripts/deploy-staging.sh --pull

  smoke-test:
    name: External smoke test
    # Deliberately back on a GitHub-hosted runner, not self-hosted — this
    # step's whole point is verifying reachability from OUTSIDE the
    # instance, over the real HTTPS path a user actually takes. Running it
    # on the instance itself would just be a loopback check with extra
    # steps.
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Smoke test (from outside the instance, over the real HTTPS path)
        # deploy-staging.sh already health-checks internally before it exits
        # 0 — this repeats the check from outside the instance. `-k`:
        # sslip.io/IP certs aside, this only needs to confirm the chain
        # responds correctly, not re-litigate TLS trust (docs/HTTPS_IP_CERTIFICATE.md
        # already covers certificate verification in its own test suite).
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsSk --max-time 10 "https://${{ secrets.EC2_HOST }}/api/health/" || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"database":"ok"'; then
              echo "Smoke test passed: $body"
              exit 0
            fi
            echo "Attempt $attempt: not healthy yet ($body), retrying..."
            sleep 10
          done
          echo "Smoke test FAILED after 5 attempts."
          exit 1
