# KarosL — test, build-validate, and deploy the staging environment.
#
# This is the one workflow in the repo that DOES have deployment credentials
# (EC2_HOST/EC2_USER/EC2_DEPLOY_KEY — docs/CI_CD.md). ci.yml deliberately does
# not: it covers dev/PRs and stays read-only. This workflow covers exactly
# one branch, cloud-deployment, and nothing else — no PRs, no other branches,
# so a feature branch is never auto-deployed to the live pilot (docs/CI_CD.md
# "Branch strategy").
#
# The deploy job `needs:` all three test/build jobs, so a test or build
# failure blocks deployment outright — nothing here ever deploys unverified
# code.
#
# The SSH key used here is a DEDICATED, restricted deploy key — not the
# operator's own admin key. Its authorized_keys entry on the instance forces
# it to run exactly one script (scripts/ci-deploy-entrypoint.sh) regardless
# of what command is requested, so a leaked key's blast radius is "can
# trigger a deploy," not "arbitrary shell on the box." See docs/CI_CD.md for
# key generation, installation, and rotation.

name: Deploy to staging

on:
  push:
    branches: [cloud-deployment]

permissions:
  contents: read

# Only one staging deployment at a time. Queue, don't cancel: cancelling a
# deploy mid-flight (mid-build, mid-restart) is worse than a short wait for
# the next push's deploy to start after this one finishes.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite
            db_engine: django.db.backends.sqlite3
            db_name: ''
            db_user: ''
            db_password: ''
            db_host: ''
            db_port: ''
          - name: postgres
            db_engine: django.db.backends.postgresql
            db_name: karosl_ci
            db_user: karosl_user
            db_password: ci-throwaway-not-a-secret
            db_host: 127.0.0.1
            db_port: '5432'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: karosl_ci
          POSTGRES_USER: karosl_user
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DB_ENGINE: ${{ matrix.db_engine }}
          DB_NAME: ${{ matrix.db_name }}
          DB_USER: ${{ matrix.db_user }}
          DB_PASSWORD: ${{ matrix.db_password }}
          DB_HOST: ${{ matrix.db_host }}
          DB_PORT: ${{ matrix.db_port }}
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create a throwaway .env so Compose can interpolate
        run: cp .env.example .env

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Build images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          targets: |
            backend
            frontend
          push: false
          load: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    # Belt-and-braces alongside `needs:` — GitHub already skips this job if
    # any dependency fails, but being explicit here means a future workflow
    # edit that changes `needs:` can't silently reintroduce "deploy on
    # partial failure" behavior without this condition also being touched.
    if: success()
    steps:
      - name: Add the EC2 host key to known_hosts
        # Not a secret — this is what makes the connection authenticate the
        # SERVER to the client, same information `ssh-keyscan` would print
        # publicly to anyone who connected. Prevents a silent MITM without
        # requiring a stored host-key secret.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_DEPLOY_KEY }}

      - name: Deploy (runs the forced-command entrypoint on the instance)
        # The command requested here is irrelevant beyond "connect" — the
        # instance's authorized_keys forces scripts/ci-deploy-entrypoint.sh
        # regardless. Written out anyway so the intent is legible in this
        # log rather than looking like a no-op connection.
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd ~/apps/karosl && ./scripts/deploy-staging.sh --pull"

      - name: Smoke test (belt-and-braces, from the runner)
        # deploy-staging.sh already health-checks internally before it exits
        # 0 — this repeats the check from outside the instance, over the
        # real HTTPS path, the way an actual user reaches the app. `-k`:
        # sslip.io/IP certs aside, this only needs to confirm the chain
        # responds correctly, not re-litigate TLS trust (docs/HTTPS_IP_CERTIFICATE.md
        # already covers certificate verification in its own test suite).
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsSk --max-time 10 "https://${{ secrets.EC2_HOST }}/api/health/" || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"database":"ok"'; then
              echo "Smoke test passed: $body"
              exit 0
            fi
            echo "Attempt $attempt: not healthy yet ($body), retrying..."
            sleep 10
          done
          echo "Smoke test FAILED after 5 attempts."
          exit 1
