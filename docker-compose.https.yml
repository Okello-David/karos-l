# KarosL staging — HTTPS stage 2 of 2: TLS termination and secure Django flags.
#
# Apply only AFTER Let's Encrypt certificates exist for ${STAGING_DOMAIN} AND
# ${PUBLIC_IP}:
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# Requires STAGING_DOMAIN and PUBLIC_IP in the server .env (never committed):
#   STAGING_DOMAIN=app.example.com
#   PUBLIC_IP=203.0.113.10
#
# PUBLIC_IP serves the bare-IP access path on its own Let's Encrypt IP-address
# certificate (short-lived, ~160h — see docs/HTTPS_IP_CERTIFICATE.md), kept
# alongside STAGING_DOMAIN's normal ~90-day cert rather than replacing it.
#
# See docs/DOMAIN_HTTPS_PLAN.md and docs/HTTPS_IP_CERTIFICATE.md for the full
# runbook and rollback.

services:
  frontend:
    # Port 80 stays published by the base file and is still required: it serves
    # the HTTP->HTTPS redirect and the ACME challenge that every renewal needs.
    ports:
      - "443:443"
    environment:
      # Substituted into the nginx template at container start. The filter
      # limits substitution to these two variables so nginx's own
      # $host/$uri/$scheme are not replaced with empty strings.
      STAGING_DOMAIN: ${STAGING_DOMAIN:?set STAGING_DOMAIN in .env}
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP in .env}
      NGINX_ENVSUBST_FILTER: STAGING_DOMAIN|PUBLIC_IP
    volumes:
      - ./deploy/nginx/staging-https.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Mounted whole and at the same path on purpose: live/<domain>/*.pem are
      # relative symlinks into archive/<domain>/, so mounting only the live
      # subdirectory yields dangling links and nginx fails to start.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

  backend:
    environment:
      # These override the base docker-compose.yml, which hardcodes all three to
      # "False" in its own environment: block — and an environment: value beats
      # env_file, so setting them in .env alone would silently do nothing.
      SECURE_SSL_REDIRECT: "True"
      CSRF_COOKIE_SECURE: "True"
      SESSION_COOKIE_SECURE: "True"
      # Required with SECURE_SSL_REDIRECT behind a TLS-terminating proxy;
      # without it Django never sees a request as secure and redirect-loops.
      USE_X_FORWARDED_PROTO: "True"
      # Short on staging: the hostname is derived from an ephemeral public IP
      # that will later belong to someone else, and HSTS is cached by browsers
      # long after this deployment is gone. Production keeps the 1-year default.
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-300}"
